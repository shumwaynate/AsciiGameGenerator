<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AsciiGameGenerator Runtime Tests</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; margin: 2rem; }
    #summary { font-size: 1.1rem; font-weight: 700; }
    .pass { color: #08752c; }
    .fail { color: #b00020; }
    #testSandbox { position: absolute; left: -10000px; top: 0; }
    .runtime-test-root { position: relative; overflow: hidden; font: 15px monospace; }
    .ascii-game-area { position: relative; width: 100%; height: 100%; }
    .asciiObject { position: absolute; white-space: pre; font: 15px monospace; }
  </style>
</head>
<body>
  <h1>Shared runtime tests</h1>
  <p id="summary">Running…</p>
  <ol id="results"></ol>
  <div id="testSandbox" aria-hidden="true"></div>
  <script src="../js/runtime/game-runtime.js"></script>
  <script src="../js/runtime/runtime-builder.js"></script>
  <script src="fixtures/runtime-fixtures.js"></script>
  <script src="runtime-tests.js"></script>
</body>
</html>
